name: Deepiri CI - deepiri-polomni

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test & Smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Ruff
        run: poetry run ruff check src/polomni tests

      - name: Unit tests
        run: poetry run pytest tests/ -m "not integration" -q

      - name: Docker build smoke
        run: docker build -f docker/Dockerfile -t deepiri-polomni:ci-smoke .
