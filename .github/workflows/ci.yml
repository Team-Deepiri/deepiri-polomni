name: Deepiri CI - deepiri-polomni

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 20
    name: Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff==0.3.7

      - name: Ruff
        run: ruff check src/polomni tests

  tests:
    timeout-minutes: 20
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry environment
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-ansi

      - name: Unit tests (parallel)
        run: poetry run pytest tests/ -m "not integration" -n auto -q

  docker:
    timeout-minutes: 20
    name: Docker Build Smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image (layer-cached)
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build --cache-from=type=gha --cache-to=type=gha,mode=max -f docker/Dockerfile -t deepiri-polomni:ci-smoke .
