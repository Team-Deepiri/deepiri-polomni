name: Windows Cache Portability

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-cache:
    name: Native Windows Cache Safety
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cache test dependencies
        run: >-
          python -m pip install
          "filelock>=3.30.0,<4"
          "numpy>=1.26,<3"
          "pydantic>=2.6,<3"
          "pytest>=8,<9"
          "pytest-cov>=4.1,<8"

      - name: Prove native Windows cache import
        env:
          PYTHONPATH: src
        run: python -c "from polomni.observatory.pipeline.cache import DataCache; print(DataCache)"

      - name: Run cache safety tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/observatory/test_cache_safety.py -q
