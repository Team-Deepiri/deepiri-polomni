services:
  polomni-lab:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: deepiri/polomni-lab:0.1.0
    container_name: polomni-lab
    ports:
      - "8091:8091"
      - "8888:8888"
    volumes:
      - ../experiments:/app/experiments
      - ../docs:/app/docs
    environment:
      - POLOMNI_ENV=lab
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: >
      sh -c "jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
      --NotebookApp.token='' --NotebookApp.password='' &
      uvicorn polomni.cli.commands.serve:api --host 0.0.0.0 --port 8091"

  polomni-lab-gpu:
    profiles: ["gpu"]
    extends:
      service: polomni-lab
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
